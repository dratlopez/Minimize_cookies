<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimize Cookies" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1720"/>
      <stop offset="100%" stop-color="#16212c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="230" rx="20" fill="url(#bg)"/>

  <!-- Diamante rojo (rechazo) -->
  <g transform="translate(120,115)">
    <rect x="-34" y="-34" width="68" height="68" rx="8" fill="#e5484d" transform="rotate(45)"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">&#10005;</text>
  </g>

  <!-- Flecha -->
  <g stroke="#4a5b68" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="185" y1="115" x2="245" y2="115"/>
    <polyline points="233,103 245,115 233,127"/>
  </g>

  <!-- Círculo verde (éxito) -->
  <g transform="translate(300,115)">
    <circle r="34" fill="#2fa968"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff">&#10003;</text>
  </g>

  <!-- Texto -->
  <text x="400" y="103" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#edf1f5">Minimize Cookies</text>
  <text x="400" y="140" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#8fa0ad">Reject cookie banners. One click. Any language.</text>
</svg>
